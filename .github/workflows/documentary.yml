
name: AI Documentary Factory

"on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-documentary:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Research documentary subject
        run: python research.py "Dr. Vijayalakshmi Deshmane"

      - name: Generate fact-check report
        run: python fact_check.py

      - name: Generate documentary story
        run: python generate_story.py "Dr. Vijayalakshmi Deshmane"

      - name: Save documentary package
        uses: actions/upload-artifact@v4
        with:
          name: documentary-package
          path: |
            output/research.json
            output/fact_check.json
            output/story.json
          if-no-files-found: error
