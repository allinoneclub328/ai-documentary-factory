
name: AI Documentary Factory

"on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-story:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate documentary story
        run: python generate_story.py "Dr. Vijayalakshmi Deshmane"

      - name: Save story package
        uses: actions/upload-artifact@v4
        with:
          name: documentary-story-package
          path: output/story.json
          if-no-files-found: error
